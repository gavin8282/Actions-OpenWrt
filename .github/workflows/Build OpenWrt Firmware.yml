name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: '选择源码仓库及分支'
        required: true
        default: 'gavin8282/g-openwrt:24.10-mtk7981'
        type: choice
        options:
          - 'gavin8282/g-openwrt:21.02-mtk7981'
          - 'gavin8282/g-openwrt:24.10-mtk7981'
          - 'gavin8282/g-openwrt:25.12-mtk7981'
          - 'padavanonly/immortalwrt-mt798x-6.6:openwrt-24.10-6.6'
          - 'chasey-dev/immortalwrt-mt798x-rebase:25.12'

      config_file:
        description: '选择配置文件 (仅24.10/25.12生效，21.02会自动匹配专属config)'
        required: true
        default: 'mt7981-ax3000_dae.config'
        type: choice
        options:
          - 'mt7981-ax3000.config'
          - 'mt7981-ax3000_dae.config'
          - '24.10-rax3000m_dae.config'

      # --- 常用设备勾选区 ---
      device_rax3000m:
        description: '移动 RAX3000M (cmcc_rax3000m)'
        type: boolean
        default: true

      device_ct3003:
        description: '星网锐捷 CT3003 (cetron_ct3003)'
        type: boolean
        default: false

      device_clt_r30b1:
        description: '创凌 CLT-R30B1 / 112M'
        type: boolean
        default: false

      device_nx30pro:
        description: '华硕/新华三 NX30Pro'
        type: boolean
        default: false

      device_ax3000t:
        description: '小米 AX3000T'
        type: boolean
        default: false

      device_wr30u:
        description: '小米/联通 WR30U'
        type: boolean
        default: false

      device_360t7:
        description: '360 T7'
        type: boolean
        default: false

      # --- 自定义任意设备节点框 ---
      custom_devices:
        description: '自定义其他设备 Node (用空格分隔，如: abt_asr3000 jcg_q30-pro)'
        required: false
        type: string
        default: ''

      clear_cache:
        description: '🧹 清理/重置编译缓存 (CCache & dl)'
        type: boolean
        default: false

jobs:
  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-devices.outputs.devices }}
    steps:
      - id: set-devices
        run: |
          DEVICES=()
          [ "${{ inputs.device_rax3000m }}" == "true" ] && DEVICES+=("rax3000m")
          [ "${{ inputs.device_ct3003 }}" == "true" ] && DEVICES+=("ct3003")
          [ "${{ inputs.device_clt_r30b1 }}" == "true" ] && DEVICES+=("clt_r30b1_112m")
          [ "${{ inputs.device_nx30pro }}" == "true" ] && DEVICES+=("nx30pro")
          [ "${{ inputs.device_ax3000t }}" == "true" ] && DEVICES+=("ax3000t")
          [ "${{ inputs.device_wr30u }}" == "true" ] && DEVICES+=("wr30u")
          [ "${{ inputs.device_360t7 }}" == "true" ] && DEVICES+=("360t7")

          CUSTOM_INPUT="${{ inputs.custom_devices }}"
          if [ -n "$CUSTOM_INPUT" ]; then
            for dev in $CUSTOM_INPUT; do
              DEVICES+=("$dev")
            done
          fi

          if [ ${#DEVICES[@]} -eq 0 ]; then
            DEVICES+=("rax3000m")
          fi

          JSON_ARRAY=$(jq -c -n '$ARGS.positional' --args "${DEVICES[@]}")
          echo "devices=$JSON_ARRAY" >> $GITHUB_OUTPUT

  build:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write
    strategy:
      fail-fast: false
      matrix:
        device_alias: ${{ fromJSON(needs.matrix_prep.outputs.devices) }}

    steps:
    - name: Parse Repo and Branch
      id: parse_repo
      run: |
        SELECTED_INPUT="${{ github.event.inputs.source_repo }}"
        REPO_NAME=$(echo "$SELECTED_INPUT" | cut -d':' -f1)
        BRANCH_NAME=$(echo "$SELECTED_INPUT" | cut -d':' -f2)
        REPO_KEY=$(echo "$REPO_NAME" | tr '/' '_')

        echo "repo=$REPO_NAME" >> $GITHUB_OUTPUT
        echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "repo_key=$REPO_KEY" >> $GITHUB_OUTPUT
        echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        repository: ${{ steps.parse_repo.outputs.repo }}
        ref: ${{ steps.parse_repo.outputs.branch }}
        fetch-depth: 1
        submodules: recursive
        persist-credentials: false

    - name: Initialization Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
        curl -fL --retry 5 --retry-delay 3 -o init_env.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
        sudo bash init_env.sh

        sudo apt-get update || true
        for pkg in ccache jq zstd pv; do
          sudo apt-get install -y --fix-missing "$pkg" || echo "⚠️ Warning: Failed to install $pkg, skipping..."
        done
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: Cache dl Directory
      uses: actions/cache@v4
      with:
        path: dl
        key: ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ inputs.clear_cache && github.run_id || 'default' }}
        restore-keys: |
          ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}-${{ matrix.device_alias }}-${{ inputs.clear_cache && github.run_id || 'default' }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}-${{ matrix.device_alias }}-
          ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

    - name: Clear Caches If Requested
      if: ${{ inputs.clear_cache }}
      run: |
        echo "⚠️ 正在清理缓存..."
        rm -rf dl
        mkdir -p dl
        [ -x "$(command -v ccache)" ] && ccache -C && ccache -z

    - name: Update & Install Feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

        # ⚠️ 在 feeds 安装完成后立刻强行剔除 mihomo 源码，避免 21.02 低版本 Golang 报错
        rm -rf feeds/helloworld/mihomo
        rm -rf package/feeds/helloworld/mihomo
        find . -type d -name "mihomo" -exec rm -rf {} +

    - name: Load Config & Set Device Dynamically
      id: set_device
      run: |
        CONFIG_NAME="${{ github.event.inputs.config_file }}"
        BRANCH="${{ steps.parse_repo.outputs.branch }}"
        ALIAS="${{ matrix.device_alias }}"

        # 1. 判断分支架构类型与 21.02 专属 Config 匹配逻辑
        FOUND_CONFIG=""
        if [[ "$BRANCH" == *"21.02"* ]]; then
          TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE"
          PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE"
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config

          # 自动匹配 21.02 根目录下的专属配置文件
          case "$ALIAS" in
            "rax3000m")
              FOUND_CONFIG="21.02.7-rax3000m-nand-byst-mtwifi-cfg-usb.config"
              NODE_NAME="cmcc_rax3000m"
              ;;
            "ct3003")
              FOUND_CONFIG="21.02.7-ct3003-byst-mtwifi-cfg.config"
              NODE_NAME="cetron_ct3003"
              ;;
            "clt_r30b1"|"clt_r30b1_112m")
              FOUND_CONFIG="21.02.7-r30b1-112M-byst-mtwifi-cfg.config"
              NODE_NAME="mt7981-clt-r30b1-112M"
              ;;
            "nx30pro")
              FOUND_CONFIG="21.02.7-nx30pro-mtwifi-cfg.config"
              NODE_NAME="h3c_nx30pro"
              ;;
            *)
              FOUND_CONFIG="$CONFIG_NAME"
              NODE_NAME="$ALIAS"
              ;;
          esac
        else
          # 24.10 / 25.12 filogic 架构逻辑
          TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE"
          PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE"
          echo "CONFIG_TARGET_mediatek=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config

          FOUND_CONFIG="$CONFIG_NAME"

          case "$ALIAS" in
            "rax3000m") NODE_NAME="cmcc_rax3000m" ;;
            "ct3003") NODE_NAME="cetron_ct3003" ;;
            "clt_r30b1") NODE_NAME=$([[ "$BRANCH" == *"25.12"* ]] && echo "creatlentem_clt-r30b1" || echo "mt7981-clt-r30b1") ;;
            "clt_r30b1_112m") NODE_NAME=$([[ "$BRANCH" == *"25.12"* ]] && echo "creatlentem_clt-r30b1-112m" || echo "mt7981-clt-r30b1-112M") ;;
            "ax3000t") NODE_NAME="xiaomi_mi-router-ax3000t" ;;
            "wr30u") NODE_NAME=$([[ "$BRANCH" == *"25.12"* ]] && echo "xiaomi_mi-router-wr30u-ubootmod" || echo "xiaomi_mi-router-wr30u-112m") ;;
            "nx30pro") NODE_NAME=$([[ "$BRANCH" == *"25.12"* ]] && echo "h3c_magic-nx30-pro" || echo "h3c_nx30pro") ;;
            "360t7") NODE_NAME=$([[ "$BRANCH" == *"25.12"* ]] && echo "qihoo_360t7" || echo "mt7981-360-t7-108M") ;;
            *) NODE_NAME="$ALIAS" ;;
          esac
        fi

        # 查找配置文件路径
        CONFIG_PATH=""
        if [ -f "$FOUND_CONFIG" ]; then
          CONFIG_PATH="$FOUND_CONFIG"
        elif [ -f "defconfig/$FOUND_CONFIG" ]; then
          CONFIG_PATH="defconfig/$FOUND_CONFIG"
        fi

        if [ -z "$CONFIG_PATH" ]; then
          echo "❌ Error: Config file $FOUND_CONFIG not found!"
          exit 1
        fi

        echo "✅ Using config file: $CONFIG_PATH"
        cp -f "$CONFIG_PATH" .config

        echo "node_name=$NODE_NAME" >> $GITHUB_OUTPUT
        echo "🎯 Selected Branch: $BRANCH"
        echo "🎯 Target Device Node: $NODE_NAME"

        # 2. 清理配置文件中原本勾选的旧目标设备
        sed -i '/CONFIG_TARGET_DEVICE_mediatek_/d' .config

        # 3. 动态写入选中的目标设备节点
        echo "${TARGET_PREFIX}_${NODE_NAME}=y" >> .config
        echo "${PKG_PREFIX}_${NODE_NAME}=\"\"" >> .config
        echo "CONFIG_CCACHE=y" >> .config

        make defconfig

    - name: Download Packages
      run: |
        make download -j$(nproc) || make download -j1 V=s
        find dl -size -1024c -delete
        make download -j1 V=s

    - name: Build Firmware
      env:
        CCACHE_DIR: ~/.ccache
        CCACHE_COMPRESS: "1"
        CCACHE_COMPRESSLEVEL: "6"
      run: |
        if [ -x "$(command -v ccache)" ]; then
          ccache -M 10G
          ccache -z
        fi
        echo "=== 编译前磁盘空间 ==="
        df -h

        NPROC=$(( $(nproc) + 1 ))
        echo -e "Starting compile with ${NPROC} threads..."
        make -j${NPROC} || make -j${NPROC} V=s || make -j1 V=s

        echo "=== 编译后磁盘空间 ==="
        df -h
        if [ -x "$(command -v ccache)" ]; then
          echo "=== CCache 缓存命中统计 ==="
          ccache -s
        fi

    - name: Upload Build Log On Failure
      if: failure()
      run: |
        NODE_NAME="${{ steps.set_device.outputs.node_name }}"
        mkdir -p failure_logs
        [ -f ".config" ] && cp -f .config failure_logs/config.buildinfo
        [ -d "logs" ] && cp -rf logs/ failure_logs/
        find . -name "*.log" -exec cp -f {} failure_logs/ \; 2>/dev/null || true
      continue-on-error: true

    - name: Upload Logs Artifact
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: Build_Failure_Logs_${{ steps.set_device.outputs.node_name }}
        path: failure_logs/

    - name: Organize Firmware Files
      id: organize
      run: |
        NODE_NAME="${{ steps.set_device.outputs.node_name }}"
        mkdir -p release_files

        [ -f ".config" ] && cp -f .config release_files/${NODE_NAME}.config

        # 1. 收集所有目标固件镜像及引导文件 (.bin, .trx, .itb, .ubi 等)
        find bin/targets/ -type f \( \
          -name "*.bin" -o \
          -name "*.trx" -o \
          -name "*.itb" -o \
          -name "*.ubi" -o \
          -name "*sysupgrade*" -o \
          -name "*factory*" -o \
          -name "*fip*" -o \
          -name "*uboot*" -o \
          -name "*.manifest" -o \
          -name "*buildinfo*" \
        \) | while read -r FILE; do
          FILENAME=$(basename "$FILE")
          cp -f "$FILE" "release_files/${NODE_NAME}-${FILENAME}"
        done

        # 2. 打包完整的 bin/targets 目录作为保底备份
        tar --exclude='*/packages' -czf "release_files/bin_targets_${NODE_NAME}.tar.gz" -C bin targets

        cd release_files
        sha256sum * > sha256sums.txt
        cd ..

        IMAGE_COUNT=$(find release_files/ -type f \( \
          -name "*.bin" -o \
          -name "*.trx" -o \
          -name "*.itb" -o \
          -name "*.ubi" -o \
          -name "*.img" -o \
          -name "*sysupgrade*" -o \
          -name "*factory*" \
        \) | wc -l)

        if [ "$IMAGE_COUNT" -eq 0 ]; then
          echo "❌ Error: 未找到任何有效的二进制固件镜像！终止 Release。"
          exit 1
        fi

        TAG_NAME="Build-${NODE_NAME}-${{ github.run_number }}"
        BUILD_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
        END_TIME=$(date +%s)
        START_TIME="${{ steps.parse_repo.outputs.start_time }}"
        ELAPSED_MIN=$(( (END_TIME - START_TIME) / 60 ))

        echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
        echo "elapsed_min=$ELAPSED_MIN" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Firmware to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_${{ steps.set_device.outputs.node_name }}_${{ github.event.inputs.config_file }}
        path: release_files/

    - name: Release Firmware to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: steps.organize.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.organize.outputs.release_tag }}
        name: "${{ steps.set_device.outputs.node_name }} Firmware Run #${{ github.run_number }}"
        body: |
          ### 🛠 编译参数信息
          - **源码仓库**: `${{ steps.parse_repo.outputs.repo }}`
          - **分支版本**: `${{ steps.parse_repo.outputs.branch }}`
          - **配置文件**: `${{ github.event.inputs.config_file }}`
          - **目标设备**: `${{ steps.set_device.outputs.node_name }}`
          - **清理缓存**: `${{ github.event.inputs.clear_cache }}`
          - **编译时间**: `${{ steps.organize.outputs.build_time }}`
          - **总计耗时**: `约 ${{ steps.organize.outputs.elapsed_min }} 分钟`
        draft: false
        prerelease: false
        overwrite_files: true
        files: release_files/*

    - name: Delete Old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.0
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 10
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}