name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:

      source_repo:
        description: '选择源码仓库及分支'
        required: true
        default: 'gavin8282/g-openwrt:24.10-mtk7981'
        type: choice
        options:
          - 'gavin8282/g-openwrt:21.02-mtk7981'
          - 'gavin8282/g-openwrt:24.10-mtk7981'
          - 'gavin8282/g-openwrt:25.12-mtk7981'
          - 'padavanonly/immortalwrt-mt798x-6.6:openwrt-24.10-6.6'
          - 'chasey-dev/immortalwrt-mt798x-rebase:25.12'

      config_file:
        description: '基础配置文件'
        required: true
        default: 'mt7981-ax3000_dae.config'
        type: choice
        options:
          - 'mt7981-ax3000.config'
          - 'mt7981-ax3000_dae.config'
          - '24.10-rax3000m_dae.config'

      # ==========================
      # 常用设备
      # ==========================

      device_rax3000m:
        description: '移动 RAX3000M'
        type: boolean
        default: true

      device_ct3003:
        description: '星网锐捷 CT3003'
        type: boolean
        default: false

      device_clt_r30b1:
        description: '创凌 CLT-R30B1 (标准版/16M/32M)'
        type: boolean
        default: false

      device_clt_r30b1_112m:
        description: '创凌 CLT-R30B1 (112M 大闪存版)'
        type: boolean
        default: false

      device_nx30pro:
        description: 'NX30Pro'
        type: boolean
        default: false

      device_ax3000t:
        description: '小米 AX3000T'
        type: boolean
        default: false

      device_wr30u:
        description: 'WR30U'
        type: boolean
        default: false

      device_360t7:
        description: '360 T7'
        type: boolean
        default: false

      # ==========================
      # 自定义设备
      # ==========================

      custom_devices:
        description: >
          自定义 alias，例如:
          a10 asr3000 gl-mt3000
        required: false
        type: string
        default: ''

      clear_cache:
        description: '清理 ccache 和 dl 缓存'
        type: boolean
        default: false

jobs:

  # =====================================================
  # 生成设备矩阵
  # =====================================================

  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-devices.outputs.devices }}

    steps:
      - name: Generate Device Matrix
        id: set-devices
        run: |
          DEVICES=()

          [ "${{ inputs.device_rax3000m }}" = "true" ] && DEVICES+=("rax3000m")
          [ "${{ inputs.device_ct3003 }}" = "true" ] && DEVICES+=("ct3003")
          [ "${{ inputs.device_clt_r30b1 }}" = "true" ] && DEVICES+=("clt_r30b1")
          [ "${{ inputs.device_clt_r30b1_112m }}" = "true" ] && DEVICES+=("clt_r30b1_112m")
          [ "${{ inputs.device_nx30pro }}" = "true" ] && DEVICES+=("nx30pro")
          [ "${{ inputs.device_ax3000t }}" = "true" ] && DEVICES+=("ax3000t")
          [ "${{ inputs.device_wr30u }}" = "true" ] && DEVICES+=("wr30u")
          [ "${{ inputs.device_360t7 }}" = "true" ] && DEVICES+=("360t7")

          CUSTOM="${{ inputs.custom_devices }}"
          if [ -n "$CUSTOM" ]; then
              for dev in $CUSTOM
              do
                  DEVICES+=("$dev")
              done
          fi

          # 默认设备
          if [ ${#DEVICES[@]} -eq 0 ]; then
              DEVICES+=("rax3000m")
          fi

          JSON=$(jq -c -n '$ARGS.positional' --args "${DEVICES[@]}")
          echo "devices=$JSON" >> $GITHUB_OUTPUT

  # =====================================================
  # 编译任务
  # =====================================================

  build:
    needs: matrix_prep
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      discussions: write

    strategy:
      fail-fast: false
      matrix:
        device_alias: ${{ fromJSON(needs.matrix_prep.outputs.devices) }}

    steps:

      # ================================
      # 解析仓库
      # ================================

      - name: Parse Repository
        id: parse_repo
        run: |
          INPUT="${{ github.event.inputs.source_repo }}"
          REPO=$(echo "$INPUT" | cut -d':' -f1)
          BRANCH=$(echo "$INPUT" | cut -d':' -f2)
          KEY=$(echo "$REPO" | tr '/' '_')

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "repo_key=$KEY" >> $GITHUB_OUTPUT
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      # ================================
      # 拉取源码
      # ================================

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse_repo.outputs.repo }}
          ref: ${{ steps.parse_repo.outputs.branch }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      # ================================
      # 初始化环境
      # ================================

      - name: Initialize Build Environment
        run: |
          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache

          curl -fL --retry 5 -o init_env.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
          sudo bash init_env.sh

          sudo apt-get update || true
          sudo apt-get install -y ccache jq zstd pv
          sudo timedatectl set-timezone Asia/Shanghai

      # ================================
      # dl cache
      # ================================

      - name: Cache DL
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ inputs.clear_cache && github.run_id || 'default' }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      # ================================
      # ccache
      # ================================

      - name: Cache CCache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}-${{ matrix.device_alias }}-${{ inputs.clear_cache && github.run_id || 'default' }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}-${{ matrix.device_alias }}-
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      # ================================
      # 清理 Cache（勾选时）
      # ================================

      - name: Clear Caches If Requested
        if: ${{ inputs.clear_cache }}
        run: |
          echo "⚠️ 正在清理 ccache 和 dl 缓存..."
          rm -rf dl
          mkdir -p dl
          [ -x "$(command -v ccache)" ] && ccache -C && ccache -z

      # ================================
      # feeds
      # ================================

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 21.02 golang兼容处理
          rm -rf feeds/helloworld/mihomo || true
          rm -rf package/feeds/helloworld/mihomo || true
          find . -type d -name mihomo -exec rm -rf {} + || true

      # ================================
      # 动态设备配置
      # ================================

      - name: Load Config And Detect Device
        id: set_device
        run: |
          CONFIG_NAME="${{ github.event.inputs.config_file }}"
          ALIAS="${{ matrix.device_alias }}"
          BRANCH="${{ steps.parse_repo.outputs.branch }}"

          echo "============================"
          echo "Alias : $ALIAS"
          echo "Branch: $BRANCH"
          echo "============================"

          # 1. 查找基础 config
          FOUND_CONFIG=""

          if [[ "$BRANCH" == *"21.02"* ]]; then
              case "$ALIAS" in
                  rax3000m)
                    FOUND_CONFIG="21.02.7-rax3000m-nand-byst-mtwifi-cfg-usb.config"
                    ;;
                  ct3003)
                    FOUND_CONFIG="21.02.7-ct3003-byst-mtwifi-cfg.config"
                    ;;
                  clt_r30b1|clt_r30b1_112m)
                    FOUND_CONFIG="21.02.7-r30b1-112M-byst-mtwifi-cfg.config"
                    ;;
                  nx30pro)
                    FOUND_CONFIG="21.02.7-nx30pro-mtwifi-cfg.config"
                    ;;
                  *)
                    FOUND_CONFIG="$CONFIG_NAME"
                    ;;
              esac
          else
              FOUND_CONFIG="$CONFIG_NAME"
          fi

          CONFIG_PATH=""

          if [ -f "$FOUND_CONFIG" ]; then
              CONFIG_PATH="$FOUND_CONFIG"
          elif [ -f "defconfig/$FOUND_CONFIG" ]; then
              CONFIG_PATH="defconfig/$FOUND_CONFIG"
          fi

          if [ -z "$CONFIG_PATH" ]; then
              echo "❌ Config不存在: $FOUND_CONFIG"
              exit 1
          fi

          echo "Using config: $CONFIG_PATH"

          # 2. 根据 config 判断 target
          if grep -q "CONFIG_TARGET_mediatek_mt7981=y" "$CONFIG_PATH"; then
              TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE"
              PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE"
              TARGET_SERIES="mt7981"
          else
              TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE"
              PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE"
              TARGET_SERIES="filogic"
          fi

          echo "Target prefix: $TARGET_PREFIX"

          # 3. 自动设备节点检测
          detect_device_node()
          {
              local alias="$1"
              local cfg="$2"
              local candidates=()

              case "$alias" in
                clt_r30b1)
                    candidates=(
                      creatlentem_clt-r30b1
                      mt7981-clt-r30b1
                    )
                    ;;
                clt_r30b1_112m)
                    candidates=(
                      creatlentem_clt-r30b1-112m
                      mt7981-clt-r30b1-112M
                      mt7981-clt-r30b1-112m
                    )
                    ;;
                rax3000m)
                    candidates=(
                      cmcc_rax3000m
                      cmcc_rax3000me
                      cmcc_rax3000m-emmc
                    )
                    ;;
                ct3003)
                    candidates=(
                      cetron_ct3003
                      cetron_ct3003-ubootmod
                    )
                    ;;
                nx30pro)
                    candidates=(
                      h3c_magic-nx30-pro
                      h3c_nx30pro
                      h3c_magic-nx30-pro-mtkuboot
                    )
                    ;;
                ax3000t)
                    candidates=(
                      xiaomi_mi-router-ax3000t
                      xiaomi_mi-router-ax3000t-ubootmod
                    )
                    ;;
                wr30u)
                    candidates=(
                      xiaomi_mi-router-wr30u-112m
                      xiaomi_redmi-router-wr30u
                      xiaomi_mi-router-wr30u-ubootmod
                    )
                    ;;
                360t7)
                    candidates=(
                      qihoo_360t7
                      mt7981-360-t7-108M
                    )
                    ;;
                *)
                    candidates=( "$alias" )
                    ;;
              esac

              # 精确匹配
              for dev in "${candidates[@]}"
              do
                  if grep -q "^CONFIG_TARGET_DEVICE_.*_DEVICE_${dev}=y" "$cfg"; then
                      echo "$dev"
                      return 0
                  fi
              done

              # Fallback 模糊搜索（按字符串长度倒序，优先长名称如 112m）
              NORMAL_ALIAS=$(echo "$alias" | tr '_' '-')

              MATCH=$(grep "^CONFIG_TARGET_DEVICE_.*_DEVICE_.*=y" "$cfg" \
                | grep -i "$NORMAL_ALIAS" \
                | sed -E 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_//;s/=y//' \
                | awk '{ print length, $0 }' | sort -rn | cut -d" " -f2- \
                | head -n1)

              if [ -n "$MATCH" ]; then
                  echo "$MATCH"
                  return 0
              fi

              echo ""
          }

          NODE_NAME=$(detect_device_node "$ALIAS" "$CONFIG_PATH")

          if [ -z "$NODE_NAME" ]; then
              echo "❌ 无法匹配设备节点"
              echo "Alias : $ALIAS"
              echo "Config: $CONFIG_PATH"
              grep "^CONFIG_TARGET_DEVICE_.*_DEVICE_.*=y" "$CONFIG_PATH" || true
              exit 1
          fi

          echo ""
          echo "🎯 Device detected: $NODE_NAME"
          echo "===== Device Verify in Config ====="
          grep "CONFIG_TARGET_DEVICE_.*${NODE_NAME}=y" "$CONFIG_PATH" || true
          echo "==================================="

          echo "node_name=$NODE_NAME" >> $GITHUB_OUTPUT

          # 4. 写入 .config
          cp -f "$CONFIG_PATH" .config

          sed -i "\|^${TARGET_PREFIX}_|d" .config
          sed -i "\|^${PKG_PREFIX}_|d" .config

          if [ "$TARGET_SERIES" == "mt7981" ]; then
              echo "CONFIG_TARGET_mediatek=y" >> .config
              echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          else
              echo "CONFIG_TARGET_mediatek=y" >> .config
              echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          fi

          echo "${TARGET_PREFIX}_${NODE_NAME}=y" >> .config
          echo "${PKG_PREFIX}_${NODE_NAME}=\"\"" >> .config
          echo "CONFIG_CCACHE=y" >> .config

          # 5. defconfig 验证
          make defconfig

          echo "====== Device Verify ======"
          if ! grep -q "${TARGET_PREFIX}_${NODE_NAME}=y" .config; then
              echo "❌ defconfig删除设备节点"
              exit 1
          fi

          echo "✅ Device OK"

      # ================================
      # 下载源码依赖包
      # ================================

      - name: Download Packages
        run: |
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -delete
          make download -j1 V=s

      # ================================
      # 执行固件编译
      # ================================

      - name: Build Firmware
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_COMPRESS: "1"
          CCACHE_COMPRESSLEVEL: "6"
        run: |
          if [ -x "$(command -v ccache)" ]; then
            ccache -M 10G
            ccache -z
          fi
          echo "=== 编译前磁盘空间 ==="
          df -h

          NPROC=$(( $(nproc) + 1 ))
          echo -e "Starting compile with ${NPROC} threads..."
          make -j${NPROC} || make -j${NPROC} V=s || make -j1 V=s

          echo "=== 编译后磁盘空间 ==="
          df -h
          if [ -x "$(command -v ccache)" ]; then
            echo "=== CCache 缓存命中统计 ==="
            ccache -s
          fi

      # ================================
      # 失败排查日志收集
      # ================================

      - name: Upload Build Log On Failure
        if: failure()
        run: |
          NODE_NAME="${{ steps.set_device.outputs.node_name }}"
          mkdir -p failure_logs
          [ -f ".config" ] && cp -f .config failure_logs/config.buildinfo
          [ -d "logs" ] && cp -rf logs/ failure_logs/
          find . -name "*.log" -exec cp -f {} failure_logs/ \; 2>/devnull || true
        continue-on-error: true

      - name: Upload Logs Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build_Failure_Logs_${{ steps.set_device.outputs.node_name }}
          path: failure_logs/

      # ================================
      # 整理编译产物
      # ================================

      - name: Organize Firmware Files
        id: organize
        run: |
          NODE_NAME="${{ steps.set_device.outputs.node_name }}"
          mkdir -p release_files

          [ -f ".config" ] && cp -f .config release_files/${NODE_NAME}.config

          # 收集所有目标固件镜像及引导文件
          find bin/targets/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" -o \
            -name "*fip*" -o \
            -name "*uboot*" -o \
            -name "*.manifest" -o \
            -name "*buildinfo*" \
          \) | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            cp -f "$FILE" "release_files/${NODE_NAME}-${FILENAME}"
          done

          # 打包完整的 bin/targets 目录作为保底备份
          tar --exclude='*/packages' -czf "release_files/bin_targets_${NODE_NAME}.tar.gz" -C bin targets

          cd release_files
          sha256sum * > sha256sums.txt
          cd ..

          IMAGE_COUNT=$(find release_files/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*.img" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" \
          \) | wc -l)

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "❌ Error: 未找到任何有效的二进制固件镜像！终止 Release。"
            exit 1
          fi

          TAG_NAME="Build-${NODE_NAME}-${{ github.run_number }}"
          BUILD_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
          END_TIME=$(date +%s)
          START_TIME="${{ steps.parse_repo.outputs.start_time }}"
          ELAPSED_MIN=$(( (END_TIME - START_TIME) / 60 ))

          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "elapsed_min=$ELAPSED_MIN" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      # ================================
      # 上传 Artifacts 及 Release
      # ================================

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_${{ steps.set_device.outputs.node_name }}_${{ github.event.inputs.config_file }}
          path: release_files/

      - name: Release Firmware to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.organize.outputs.release_tag }}
          name: "${{ steps.set_device.outputs.node_name }} Firmware Run #${{ github.run_number }}"
          body: |
            ### 🛠 编译参数信息
            - **源码仓库**: `${{ steps.parse_repo.outputs.repo }}`
            - **分支版本**: `${{ steps.parse_repo.outputs.branch }}`
            - **配置文件**: `${{ github.event.inputs.config_file }}`
            - **目标设备**: `${{ steps.set_device.outputs.node_name }}`
            - **清理缓存**: `${{ github.event.inputs.clear_cache }}`
            - **编译时间**: `${{ steps.organize.outputs.build_time }}`
            - **总计耗时**: `约 ${{ steps.organize.outputs.elapsed_min }} 分钟`
          draft: false
          prerelease: false
          overwrite_files: true
          files: release_files/*

      - name: Delete Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          keep_latest: 10
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}