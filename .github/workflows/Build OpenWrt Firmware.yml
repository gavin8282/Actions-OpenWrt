name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:

      source_repo:
        description: '选择源码仓库及分支'
        required: true
        default: 'gavin8282/g-openwrt:24.10-mtk7981'
        type: choice
        options:
          - 'gavin8282/g-openwrt:21.02-mtk7981'
          - 'gavin8282/g-openwrt:24.10-mtk7981'
          - 'gavin8282/g-openwrt:25.12-mtk7981'
          - 'padavanonly/immortalwrt-mt798x-6.6:openwrt-24.10-6.6'
          - 'chasey-dev/immortalwrt-mt798x-rebase:25.12'

      config_file:
        description: '基础配置文件'
        required: true
        default: 'mt7981-ax3000_dae.config'
        type: choice
        options:
          - 'mt7981-ax3000.config'
          - 'mt7981-ax3000_dae.config'

      # ==========================
      # 常用设备（默认勾选三大主力）
      # ==========================

      device_rax3000m:
        description: '移动 RAX3000M (cmcc_rax3000m)'
        type: boolean
        default: true

      device_ct3003:
        description: '星网锐捷 CT3003 (cetron_ct3003)'
        type: boolean
        default: true

      device_clt_r30b1_112m:
        description: '创凌 CLT-R30B1 (112M 大闪存版)'
        type: boolean
        default: true

      # ==========================
      # 其他可选设备（默认不勾选）
      # ==========================

      device_clt_r30b1:
        description: '创凌 CLT-R30B1 (标准版/16M/32M)'
        type: boolean
        default: false

      device_nx30pro:
        description: 'NX30Pro'
        type: boolean
        default: false

      device_ax3000t:
        description: '小米 AX3000T'
        type: boolean
        default: false

      device_wr30u:
        description: 'WR30U'
        type: boolean
        default: false

      device_360t7:
        description: '360 T7'
        type: boolean
        default: false

      # ==========================
      # 自定义设备
      # ==========================

      custom_devices:
        description: >
          自定义 alias，例如:
          a10 asr3000 gl-mt3000
        required: false
        type: string
        default: ''

      clear_cache:
        description: '清理 ccache 和 dl 缓存'
        type: boolean
        default: false

jobs:

  # =====================================================
  # 1. 单虚拟机高效编译任务（省时省分钟）
  # =====================================================

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      discussions: write

    steps:

      # ================================
      # 解析仓库信息
      # ================================

      - name: Parse Repository
        id: parse_repo
        run: |
          INPUT="${{ github.event.inputs.source_repo }}"
          REPO="${INPUT%:*}"
          BRANCH="${INPUT##*:}"
          KEY=$(echo "$REPO" | tr '/' '_')

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "repo_key=$KEY" >> $GITHUB_OUTPUT
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      # ================================
      # 拉取源码
      # ================================

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse_repo.outputs.repo }}
          ref: ${{ steps.parse_repo.outputs.branch }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      # ================================
      # 初始化构建环境
      # ================================

      - name: Initialize Build Environment
        run: |
          sudo rm -rf \
            /etc/apt/sources.list.d/* \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache

          curl -fL --retry 5 -o init_env.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
          sudo bash init_env.sh

          sudo apt-get update || true
          sudo apt-get install -y ccache jq zstd pv
          sudo timedatectl set-timezone Asia/Shanghai

      # ================================
      # 缓存加载 (DL & CCache)
      # ================================

      - name: Cache DL
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      - name: Cache CCache
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ github.event.inputs.config_file }}-
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      - name: Clear Caches If Requested
        if: ${{ inputs.clear_cache }}
        run: |
          echo "⚠️ 正在清理 ccache 和 dl 缓存..."
          rm -rf dl
          mkdir -p dl
          [ -x "$(command -v ccache)" ] && ccache -C && ccache -z

      # ================================
      # Feeds 依赖更新与清洗
      # ================================

      - name: Update Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find package/ feeds/ -type d -name "mihomo" -exec rm -rf {} + 2>/dev/null || true

      # ================================
      # 动态写入选中的所有设备节点 (单次出多包)
      # ================================

      - name: Load Config And Enable Devices
        id: set_device
        run: |
          CONFIG_NAME="${{ github.event.inputs.config_file }}"
          BRANCH="${{ steps.parse_repo.outputs.branch }}"

          # 1. 搜集所有勾选的别名
          SELECTED_ALIASES=()
          [ "${{ inputs.device_rax3000m }}" = "true" ] && SELECTED_ALIASES+=("rax3000m")
          [ "${{ inputs.device_ct3003 }}" = "true" ] && SELECTED_ALIASES+=("ct3003")
          [ "${{ inputs.device_clt_r30b1_112m }}" = "true" ] && SELECTED_ALIASES+=("clt_r30b1_112m")
          [ "${{ inputs.device_clt_r30b1 }}" = "true" ] && SELECTED_ALIASES+=("clt_r30b1")
          [ "${{ inputs.device_nx30pro }}" = "true" ] && SELECTED_ALIASES+=("nx30pro")
          [ "${{ inputs.device_ax3000t }}" = "true" ] && SELECTED_ALIASES+=("ax3000t")
          [ "${{ inputs.device_wr30u }}" = "true" ] && SELECTED_ALIASES+=("wr30u")
          [ "${{ inputs.device_360t7 }}" = "true" ] && SELECTED_ALIASES+=("360t7")

          CUSTOM="${{ inputs.custom_devices }}"
          if [ -n "$CUSTOM" ]; then
              read -ra CUSTOM_DEVS <<< "$CUSTOM"
              for dev in "${CUSTOM_DEVS[@]}"; do
                  [ -n "$dev" ] && SELECTED_ALIASES+=("$dev")
              done
          fi

          [ ${#SELECTED_ALIASES[@]} -eq 0 ] && SELECTED_ALIASES+=("rax3000m")

          echo "📋 本次选中的设备别名: ${SELECTED_ALIASES[*]}"

          # 2. 定位配置文件
          FOUND_CONFIG="$CONFIG_NAME"
          CONFIG_PATH=""
          if [ -f "$FOUND_CONFIG" ]; then
              CONFIG_PATH="$FOUND_CONFIG"
          elif [ -f "defconfig/$FOUND_CONFIG" ]; then
              CONFIG_PATH="defconfig/$FOUND_CONFIG"
          fi

          if [ -z "$CONFIG_PATH" ]; then
              echo "❌ 找不到配置文件: $FOUND_CONFIG"
              exit 1
          fi

          cp -f "$CONFIG_PATH" .config

          # 3. 判断芯片 Target 前缀
          if grep -q "CONFIG_TARGET_mediatek_mt7981=y" "$CONFIG_PATH"; then
              TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE"
              PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE"
              TARGET_SERIES="mt7981"
          else
              TARGET_PREFIX="CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE"
              PKG_PREFIX="CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE"
              TARGET_SERIES="filogic"
          fi

          # 清除配置中原有的默认设备节点
          sed -i "\|^${TARGET_PREFIX}_|d" .config
          sed -i "\|^${PKG_PREFIX}_|d" .config

          if [ "$TARGET_SERIES" == "mt7981" ]; then
              echo "CONFIG_TARGET_mediatek=y" >> .config
              echo "CONFIG_TARGET_mediatek_mt7981=y" >> .config
          else
              echo "CONFIG_TARGET_mediatek=y" >> .config
              echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          fi

          # 4. 节点匹配函数
          detect_device_node()
          {
              local alias="$1"
              local cfg="$2"
              local candidates=()

              case "$alias" in
                clt_r30b1) candidates=( creatlentem_clt-r30b1 mt7981-clt-r30b1 ) ;;
                clt_r30b1_112m) candidates=( creatlentem_clt-r30b1-112m mt7981-clt-r30b1-112M mt7981-clt-r30b1-112m ) ;;
                rax3000m) candidates=( cmcc_rax3000m cmcc_rax3000me cmcc_rax3000m-emmc ) ;;
                ct3003) candidates=( cetron_ct3003 cetron_ct3003-ubootmod ) ;;
                nx30pro) candidates=( h3c_magic-nx30-pro h3c_nx30pro h3c_magic-nx30-pro-mtkuboot ) ;;
                ax3000t) candidates=( xiaomi_mi-router-ax3000t xiaomi_mi-router-ax3000t-ubootmod ) ;;
                wr30u) candidates=( xiaomi_mi-router-wr30u-112m xiaomi_redmi-router-wr30u xiaomi_mi-router-wr30u-ubootmod ) ;;
                360t7) candidates=( qihoo_360t7 mt7981-360-t7-108M ) ;;
                *) candidates=( "$alias" ) ;;
              esac

              for dev in "${candidates[@]}"; do
                  if grep -q "^CONFIG_TARGET_DEVICE_.*_DEVICE_${dev}=y" "$cfg"; then
                      echo "$dev"
                      return 0
                  fi
              done

              NORMAL_ALIAS=$(echo "$alias" | tr '_' '-')
              MATCH=$(grep "^CONFIG_TARGET_DEVICE_.*_DEVICE_.*=y" "$cfg" \
                | grep -i "$NORMAL_ALIAS" \
                | sed -E 's/^CONFIG_TARGET_DEVICE_.*_DEVICE_//;s/=y//' \
                | awk '{ print length, $0 }' | sort -rn | cut -d" " -f2- \
                | head -n1)

              if [ -n "$MATCH" ]; then
                  echo "$MATCH"
                  return 0
              fi
              echo ""
          }

          # 5. 一次性将所有选中的设备开启标识注入 .config
          ENABLED_DEVICES=()
          for alias in "${SELECTED_ALIASES[@]}"; do
              NODE=$(detect_device_node "$alias" "$CONFIG_PATH")
              if [ -n "$NODE" ]; then
                  echo "🎯 开启设备构建节点: $NODE (源别名: $alias)"
                  echo "${TARGET_PREFIX}_${NODE}=y" >> .config
                  echo "${PKG_PREFIX}_${NODE}=\"\"" >> .config
                  ENABLED_DEVICES+=("$NODE")
              else
                  echo "⚠️ 未能识别别名 $alias 的节点，已忽略"
              fi
          done

          echo "CONFIG_CCACHE=y" >> .config

          # 6. 生成基础扩展配置
          make defconfig

          echo "summary_devices=${ENABLED_DEVICES[*]}" >> $GITHUB_OUTPUT

      # ================================
      # 下载依赖包
      # ================================

      - name: Download Packages
        run: |
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -delete
          make download -j1 V=s

      # ================================
      # 执行一次编译（同时生成所有选中设备的固件）
      # ================================

      - name: Build Firmware
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_COMPRESS: "1"
          CCACHE_COMPRESSLEVEL: "6"
        run: |
          if [ -x "$(command -v ccache)" ]; then
            ccache -M 10G
            ccache -z
          fi
          echo "=== 编译前磁盘空间 ==="
          df -h

          NPROC=$(( $(nproc) + 1 ))
          echo -e "Starting compile with ${NPROC} threads..."
          make -j${NPROC} || make -j${NPROC} V=s || make -j1 V=s

          echo "=== 编译后磁盘空间 ==="
          df -h
          if [ -x "$(command -v ccache)" ]; then
            echo "=== CCache 缓存命中统计 ==="
            ccache -s
          fi

      # ================================
      # 失败排查日志收集
      # ================================

      - name: Upload Build Log On Failure
        if: failure()
        run: |
          mkdir -p failure_logs
          [ -f ".config" ] && cp -f .config failure_logs/config.buildinfo
          [ -d "logs" ] && cp -rf logs/ failure_logs/
          find . -name "*.log" -exec cp -f {} failure_logs/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload Logs Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build_Failure_Logs
          path: failure_logs/

      # ================================
      # 整理编译产物
      # ================================

      - name: Organize Firmware Files
        id: organize
        run: |
          mkdir -p release_files

          CONFIG_SHORT=$(basename "${{ github.event.inputs.config_file }}" .config)
          echo "config_short=$CONFIG_SHORT" >> $GITHUB_OUTPUT

          [ -f ".config" ] && cp -f .config release_files/build.config

          # 提取所有生成的各设备固件
          find bin/targets/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" -o \
            -name "*fip*" -o \
            -name "*uboot*" -o \
            -name "*.manifest" -o \
            -name "*buildinfo*" \
          \) | while read -r FILE; do
            cp -f "$FILE" release_files/
          done

          # 打包完整备份
          tar --exclude='*/packages' -czf release_files/bin_targets_all.tar.gz -C bin targets

          cd release_files
          sha256sum * > sha256sums.txt
          cd ..

          IMAGE_COUNT=$(find release_files/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*.img" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" \
          \) | wc -l)

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "❌ Error: 未找到任何有效的二进制固件镜像！终止 Release。"
            exit 1
          fi

          TAG_NAME="Build-MT7981-${{ github.run_number }}"
          BUILD_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
          END_TIME=$(date +%s)
          START_TIME="${{ steps.parse_repo.outputs.start_time }}"
          ELAPSED_MIN=$(( (END_TIME - START_TIME) / 60 ))

          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "elapsed_min=$ELAPSED_MIN" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      # ================================
      # 上传 Artifacts 及打包发布 Release
      # ================================

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_MT7981_Firmwares_${{ steps.organize.outputs.config_short }}
          path: release_files/

      - name: Release Firmware to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.organize.outputs.release_tag }}
          name: "MT7981 Multi-Device Firmware Run #${{ github.run_number }}"
          body: |
            ### 🛠 编译参数信息
            - **源码仓库**: `${{ steps.parse_repo.outputs.repo }}`
            - **分支版本**: `${{ steps.parse_repo.outputs.branch }}`
            - **配置文件**: `${{ github.event.inputs.config_file }}`
            - **构建设备**: `${{ steps.set_device.outputs.summary_devices }}`
            - **清理缓存**: `${{ github.event.inputs.clear_cache }}`
            - **编译时间**: `${{ steps.organize.outputs.build_time }}`
            - **总计耗时**: `约 ${{ steps.organize.outputs.elapsed_min }} 分钟`
          draft: false
          prerelease: false
          overwrite_files: true
          files: release_files/*

  # =====================================================
  # 2. 独立 Release 保留与清理 Job
  # =====================================================

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: success()

    steps:
      - name: Delete Old Build-MT7981-* Releases & Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 正在扫描以 Build-MT7981- 开头的旧 Release..."

          mapfile -t OLD_TAGS < <(
            gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep '^Build-MT7981-' \
              | tail -n +11
          )

          if [ ${#OLD_TAGS[@]} -eq 0 ]; then
            echo "✨ 没有需要清理的旧 Release。"
            exit 0
          fi

          for tag in "${OLD_TAGS[@]}"; do
            if [ -n "$tag" ]; then
              echo "🗑️ 正在删除旧 Release 及 Git Tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          echo "✅ 清理完毕，已保留最近 10 个构建 Release。"