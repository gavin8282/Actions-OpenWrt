name: Build OpenWrt Firmware

on:
  workflow_dispatch:
    inputs:

      source_repo:
        description: '选择源码仓库及分支'
        required: true
        default: 'gavin8282/g-openwrt:25.12-mtk7981'
        type: choice
        options:
          - 'gavin8282/g-openwrt:25.12-mtk7981'
          - 'gavin8282/g-openwrt:24.10-mtk7981'
          - 'gavin8282/g-openwrt:openwrt-25.12'
          - 'gavin8282/g-openwrt:21.02-mtk7981'
          - 'padavanonly/immortalwrt-mt798x-6.6:openwrt-24.10-6.6'
          - 'chasey-dev/immortalwrt-mt798x-rebase:25.12'

      config_file:
        description: '选择基础配置文件'
        required: true
        default: 'configs/25.12-mtk7981_dae.config'
        type: choice
        options:
          - 'configs/25.12-mtk7981_dae.config'
          - 'configs/x86_64_dae.config'
          - 'configs/mt7981-ax3000_dae.config'
          - 'configs/24.10-rax3000m_dae.config'
          - 'defconfig/mt7981-ax3000.config'
          - 'defconfig/mt7986-ax6000.config'

      device_preset:
        description: '常用机型快捷下拉选择'
        required: true
        default: 'ALL # 编译配置中的全部设备'
        type: choice
        options:
          - 'ALL # 编译配置中的全部设备'
          - 'cmcc_rax3000m # 移动 CMCC RAX3000M (NAND)'
          - 'cmcc_rax3000m-emmc # 移动 CMCC RAX3000M (eMMC)'
          - 'h3c_magic-nx30-pro # 新华三 H3C NX30 Pro'
          - 'xiaomi_mi-router-ax3000t # 小米 Xiaomi AX3000T'
          - 'xiaomi_mi-router-wr30u-stock # 小米 Xiaomi WR30U (原厂固件布局)'
          - 'qihoo_360t7 # 奇虎 360 T7'
          - 'glinet_gl-mt3000 # 格联 GL.iNet MT3000 (Beryl AX)'
          - 'glinet_gl-mt2500 # 格联 GL.iNet MT2500 (Brume 2)'
          - 'asus_rt-ax52 # 华硕 ASUS RT-AX52'
          - 'cmcc_a10-stock # 中移物联 CMCC A10 (原厂布局)'
          - 'cmcc_a10-ubootmod # 中移物联 CMCC A10 (ubootmod)'
          - 'cetron_ct3003 # 烽火 HG680 / CT3003'
          - 'konka_komi-a31 # 康佳 KONKA KOMI A31'
          - 'jcg_q30-pro # 捷稀 JCG Q30 Pro'
          - 'cudy_wr3000-v1 # 库迪 Cudy WR3000 v1'
          - 'cudy_tr3000-v1 # 库迪 Cudy TR3000 v1'
          - 'creatlentem_clt-r30b1-112m # 创凌 Creatlentem CLT-R30B1 (112M)'
          - 'abt_asr3000 # 安博通 ABT ASR3000'
          - 'livinet_zr-3020 # 小娱 Livinet ZR-3020'
          - 'CUSTOM # 手动在下方输入框指定多台设备'

      custom_devices:
        description: '手动指定设备 (选 CUSTOM 时生效，以空格分隔多个机型)'
        required: false
        default: ''
        type: string

      clear_cache:
        description: '清理 ccache 和 dl 缓存'
        type: boolean
        default: false

jobs:

  # =====================================================
  # 1. 编译任务
  # =====================================================

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    permissions:
      contents: write
      discussions: write

    steps:

      # ================================
      # 解析仓库信息
      # ================================

      - name: Parse Repository
        id: parse_repo
        run: |
          INPUT="${{ inputs.source_repo }}"
          REPO="${INPUT%:* Kirchen}"
          REPO="${INPUT%:*}"
          BRANCH="${INPUT##*:}"
          KEY=$(echo "$REPO" | tr '/' '_')

          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "repo_key=$KEY" >> $GITHUB_OUTPUT
          echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      # ================================
      # 检出 Actions-OpenWrt (当前配置仓库)
      # ================================

      - name: Checkout Actions Runner Configs
        uses: actions/checkout@v4
        with:
          path: runner-configs

      # ================================
      # 拉取 OpenWrt 源码
      # ================================

      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.parse_repo.outputs.repo }}
          ref: ${{ steps.parse_repo.outputs.branch }}
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
          path: openwrt

      # ================================
      # 初始化构建环境
      # ================================

      - name: Initialize Build Environment
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache

          curl -fL --retry 5 -o init_env.sh https://build-scripts.immortalwrt.org/init_build_environment.sh
          sudo bash init_env.sh

          sudo apt-get update || true
          sudo apt-get install -y ccache jq zstd pv
          sudo timedatectl set-timezone Asia/Shanghai

      # ================================
      # 缓存加载 (DL & CCache)
      # ================================

      - name: Cache DL
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}
          restore-keys: |
            ${{ runner.os }}-dl-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      - name: Cache CCache
        if: ${{ !inputs.clear_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ inputs.config_file }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-${{ inputs.config_file }}-
            ${{ runner.os }}-ccache-${{ steps.parse_repo.outputs.repo_key }}-${{ steps.parse_repo.outputs.branch }}-

      - name: Clear Caches If Requested
        if: ${{ inputs.clear_cache }}
        run: |
          echo "⚠️ 正在清理 ccache 和 dl 缓存..."
          rm -rf openwrt/dl
          mkdir -p openwrt/dl
          [ -x "$(command -v ccache)" ] && ccache -C && ccache -z

      # ================================
      # 执行 DIY 脚本 1 (Feeds 前)
      # ================================

      - name: Run DIY Script 1
        run: |
          if [ -f "runner-configs/diy-part1.sh" ]; then
            chmod +x runner-configs/diy-part1.sh
            cd openwrt
            $GITHUB_WORKSPACE/runner-configs/diy-part1.sh
          fi

      # ================================
      # Feeds 依赖更新与清洗
      # ================================

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          find package/ feeds/ -type d -name "mihomo" -exec rm -rf {} + 2>/dev/null || true

      # ================================
      # 执行 DIY 脚本 2 (Feeds 后)
      # ================================

      - name: Run DIY Script 2
        run: |
          if [ -f "runner-configs/diy-part2.sh" ]; then
            chmod +x runner-configs/diy-part2.sh
            cd openwrt
            $GITHUB_WORKSPACE/runner-configs/diy-part2.sh
          fi

      # ================================
      # 加载配置文件 (优先 runner-configs/configs，其次源码仓库)
      # ================================

      - name: Load Config File
        id: set_device
        run: |
          cd openwrt
          CONFIG_NAME="${{ inputs.config_file }}"
          CONFIG_PATH=""

          # 1. 查找 runner-configs 中的配置
          if [ -f "$GITHUB_WORKSPACE/runner-configs/configs/$CONFIG_NAME" ]; then
              CONFIG_PATH="$GITHUB_WORKSPACE/runner-configs/configs/$CONFIG_NAME"
          elif [ -f "$GITHUB_WORKSPACE/runner-configs/$CONFIG_NAME" ]; then
              CONFIG_PATH="$GITHUB_WORKSPACE/runner-configs/$CONFIG_NAME"
          # 2. 查找 openwrt 源码内的 defconfig
          elif [ -f "defconfig/$CONFIG_NAME" ]; then
              CONFIG_PATH="defconfig/$CONFIG_NAME"
          elif [ -f "$CONFIG_NAME" ]; then
              CONFIG_PATH="$CONFIG_NAME"
          fi

          if [ -z "$CONFIG_PATH" ]; then
              echo "❌ 在工作流配置库与源码仓库中均未找到: $CONFIG_NAME"
              exit 1
          fi

          echo "🎯 正在应用配置文件: $CONFIG_PATH"
          cp -f "$CONFIG_PATH" .config

          SELECTED_PRESET="${{ inputs.device_preset }}"
          PRESET_DEV="${SELECTED_PRESET%% #*}"

          FINAL_DEVICES=""
          if [ "$PRESET_DEV" = "ALL" ]; then
              echo "🎯 构建模式: 编译配置文件中预设的全部设备"
          elif [ "$PRESET_DEV" = "CUSTOM" ]; then
              FINAL_DEVICES="${{ inputs.custom_devices }}"
              echo "🎯 构建模式: 手动指定设备 ($FINAL_DEVICES)"
          else
              FINAL_DEVICES="$PRESET_DEV"
              echo "🎯 构建模式: 下拉单选设备 ($FINAL_DEVICES)"
          fi

          if [ -n "$FINAL_DEVICES" ]; then
              echo "⚙️ 正在应用设备过滤器..."
              # 禁用所有默认设备的选中状态
              sed -i 's/^CONFIG_TARGET_DEVICE_.*=y/# &/' .config
              sed -i 's/CONFIG_TARGET_MULTI_PROFILE=y/# CONFIG_TARGET_MULTI_PROFILE is not set/' .config

              # 依次激活用户指定的设备
              for dev in $FINAL_DEVICES; do
                  clean_dev=$(echo "$dev" | tr -d ' ' | sed 's/^CONFIG_TARGET_DEVICE_//; s/=y//')
                  if [ -n "$clean_dev" ]; then
                      echo "✅ 激活目标设备: $clean_dev"
                      # 智能适配 24.10 / 25.12 命名规则（如 360t7 / nx30-pro）
                      # 1. 尝试直接匹配
                      if grep -q "CONFIG_TARGET_DEVICE_.*_DEVICE_${clean_dev}" .config; then
                          sed -i "s/.*CONFIG_TARGET_DEVICE_.*_DEVICE_${clean_dev}=y/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${clean_dev}=y/" .config
                      elif [ "$clean_dev" = "qihoo_360t7" ] && grep -q "CONFIG_TARGET_DEVICE_.*_DEVICE_mt7981-360-t7-108M" .config; then
                          sed -i "s/.*CONFIG_TARGET_DEVICE_.*_DEVICE_mt7981-360-t7-108M=y/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_mt7981-360-t7-108M=y/" .config
                      elif [ "$clean_dev" = "h3c_magic-nx30-pro" ] && grep -q "CONFIG_TARGET_DEVICE_.*_DEVICE_h3c_nx30pro" .config; then
                          sed -i "s/.*CONFIG_TARGET_DEVICE_.*_DEVICE_h3c_nx30pro=y/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_h3c_nx30pro=y/" .config
                      elif [ "$clean_dev" = "creatlentem_clt-r30b1-112m" ] && grep -q "CONFIG_TARGET_DEVICE_.*_DEVICE_mt7981-clt-r30b1-112M" .config; then
                          sed -i "s/.*CONFIG_TARGET_DEVICE_.*_DEVICE_mt7981-clt-r30b1-112M=y/CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_mt7981-clt-r30b1-112M=y/" .config
                      else
                          echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${clean_dev}=y" >> .config
                      fi
                  fi
              done
          fi

          echo "CONFIG_CCACHE=y" >> .config
          make defconfig

      # ================================
      # 下载依赖包
      # ================================

      - name: Download Packages
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s
          find dl -size -1024c -delete
          make download -j1 V=s

      # ================================
      # 执行编译
      # ================================

      - name: Build Firmware
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_COMPRESS: "1"
          CCACHE_COMPRESSLEVEL: "6"
        run: |
          cd openwrt
          if [ -x "$(command -v ccache)" ]; then
            ccache -M 10G
            ccache -z
          fi
          echo "=== 编译前磁盘空间 ==="
          df -h

          NPROC=$(( $(nproc) + 1 ))
          echo -e "Starting compile with ${NPROC} threads..."
          make -j${NPROC} || make -j1 V=s

          echo "=== 编译后磁盘空间 ==="
          df -h
          if [ -x "$(command -v ccache)" ]; then
            echo "=== CCache 缓存命中统计 ==="
            ccache -s
          fi

      # ================================
      # 失败排查日志收集
      # ================================

      - name: Upload Build Log On Failure
        if: failure()
        run: |
          mkdir -p failure_logs
          [ -f "openwrt/.config" ] && cp -f openwrt/.config failure_logs/config.buildinfo
          [ -d "openwrt/logs" ] && cp -rf openwrt/logs/ failure_logs/
          find openwrt -name "*.log" -exec cp -f {} failure_logs/ \; 2>/dev/null || true
        continue-on-error: true

      - name: Upload Logs Artifact
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Build_Failure_Logs
          path: failure_logs/

      # ================================
      # 整理编译产物
      # ================================

      - name: Organize Firmware Files
        id: organize
        run: |
          mkdir -p release_files

          CONFIG_SHORT=$(basename "${{ inputs.config_file }}" .config)
          echo "config_short=$CONFIG_SHORT" >> $GITHUB_OUTPUT

          [ -f "openwrt/.config" ] && cp -f openwrt/.config release_files/build.config

          # 提取刷机固件及配置元数据
          find openwrt/bin/targets/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" -o \
            -name "*fip*" -o \
            -name "*uboot*" -o \
            -name "*.manifest" -o \
            -name "*buildinfo*" \
          \) | while read -r FILE; do
            cp -f "$FILE" release_files/
          done

          cd release_files
          sha256sum * > sha256sums.txt
          cd ..

          IMAGE_COUNT=$(find release_files/ -type f \( \
            -name "*.bin" -o \
            -name "*.trx" -o \
            -name "*.itb" -o \
            -name "*.ubi" -o \
            -name "*.img" -o \
            -name "*sysupgrade*" -o \
            -name "*factory*" \
          \) | wc -l)

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo "❌ Error: 未找到任何有效的二进制固件镜像！终止 Release。"
            exit 1
          fi

          # 提取版本号
          BRANCH_NAME="${{ steps.parse_repo.outputs.branch }}"
          VER_NUM=$(echo "$BRANCH_NAME" | grep -oE '[0-9]+\.[0-9]+' | head -n1)
          [ -z "$VER_NUM" ] && VER_NUM="24.10"

          BUILD_DATE="$(date +'%Y.%m.%d')"
          TAG_NAME="v${VER_NUM}-MT7981-${BUILD_DATE}"

          BUILD_TIME="$(date +'%Y-%m-%d %H:%M:%S')"
          END_TIME=$(date +%s)
          START_TIME="${{ steps.parse_repo.outputs.start_time }}"
          ELAPSED_MIN=$(( (END_TIME - START_TIME) / 60 ))

          echo "release_tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
          echo "elapsed_min=$ELAPSED_MIN" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      # ================================
      # 上传 Artifacts 及打包发布 Release
      # ================================

      - name: Upload Firmware to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_MT7981_Firmwares_${{ steps.organize.outputs.config_short }}
          path: release_files/

      - name: Release Firmware to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.organize.outputs.release_tag }}
          name: ${{ steps.organize.outputs.release_tag }}
          body: |
            ### 🛠 编译参数信息
            - **源码仓库**: `${{ steps.parse_repo.outputs.repo }}`
            - **分支版本**: `${{ steps.parse_repo.outputs.branch }}`
            - **配置文件**: `${{ inputs.config_file }}`
            - **清理缓存**: `${{ inputs.clear_cache }}`
            - **编译时间**: `${{ steps.organize.outputs.build_time }}`
            - **总计耗时**: `约 ${{ steps.organize.outputs.elapsed_min }} 分钟`
          draft: false
          prerelease: false
          overwrite_files: true
          files: release_files/*

  # =====================================================
  # 2. 清理历史 Release Job
  # =====================================================

  cleanup:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: success()

    steps:
      - name: Delete Old MT7981 Releases & Tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 正在扫描旧的 MT7981 Release..."

          mapfile -t OLD_TAGS < <(
            gh release list --limit 100 --json tagName --jq '.[].tagName' \
              | grep -E '(-MT7981-|^Build-MT7981-)' \
              | tail -n +11
          )

          if [ ${#OLD_TAGS[@]} -eq 0 ]; then
            echo "✨ 没有需要清理的旧 Release。"
            exit 0
          fi

          for tag in "${OLD_TAGS[@]}"; do
            if [ -n "$tag" ]; then
              echo "🗑️ 正在删除旧 Release 及 Git Tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done

          echo "✅ 清理完毕，已保留最近 10 个构建 Release。"
